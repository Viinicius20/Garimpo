<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garimpo</title>
<style>
  body { margin:0; padding:24px 16px; background:#1b1d21; color:#e8e6e1; font:16px/1.5 system-ui,"Segoe UI",sans-serif; }
  main { max-width:680px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 20px; }
  .p { background:#25282e; border:1px solid #353941; border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .top { display:flex; justify-content:space-between; gap:8px; }
  .name { font-weight:600; }
  .nums { display:flex; gap:20px; flex-wrap:wrap; margin:8px 0; }
  .nums div span { display:block; color:#9a9ca3; font-size:.8rem; }
  .now { color:#5fb37c; } .hit { color:#e0a84a; font-weight:600; }
  .muted { color:#9a9ca3; font-size:.85rem; }
  a { color:#9a9ca3; }
  button { background:transparent; color:inherit; border:1px solid #353941; border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; font-size:.85rem; }
  form { display:flex; gap:8px; flex-wrap:wrap; margin-top:24px; }
  input { background:#25282e; color:inherit; border:1px solid #353941; border-radius:6px; padding:8px 10px; font:inherit; min-width:0; }
  #name { flex:1 1 140px; } #url { flex:3 1 260px; } #target { flex:1 1 110px; }
  form button { padding:8px 16px; background:#e8e6e1; color:#1b1d21; }
  #err { color:#d95c5c; margin-top:12px; min-height:1.5em; }
</style>
</head>
<body>
<main>
  <h1>Garimpo</h1>
  <div id="list"></div>
  <form id="form">
    <input id="name" placeholder="Nome" required>
    <input id="url" type="url" placeholder="Link do produto (https://...)" required>
    <input id="target" type="number" step="0.01" min="0" placeholder="Meta (R$)" required>
    <button type="submit">Adicionar</button>
  </form>
  <div id="err" role="alert"></div>
</main>
<script>
const API = '/api/products';
const brl = v => v == null ? '—' : Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const err = document.getElementById('err');

async function call(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) { err.textContent = 'Erro ' + r.status; throw new Error(r.status); }
  err.textContent = '';
  return r;
}

async function load() {
  const items = await (await call(API)).json();
  document.getElementById('list').innerHTML = items.length ? items.map(p => `
    <div class="p">
      <div class="top"><span class="name">${esc(p.name)}</span><button onclick="del(${p.id})">Remover</button></div>
      <div class="nums">
        <div><span>Atual</span><b class="${p.current != null && p.current <= p.target ? 'hit' : 'now'}">${brl(p.current)}</b></div>
        <div><span>Média 90 dias</span>${brl(p.avg90)}</div>
        <div><span>Menor 90 dias</span>${brl(p.min90)}</div>
        <div><span>Meta</span>${brl(p.target)}</div>
      </div>
      <div class="muted">Baseado em ${p.days} dia(s) de dados · <a href="${esc(p.url)}" target="_blank" rel="noopener">abrir na loja</a></div>
    </div>`).join('') : '<p class="muted">Nenhum produto. Adicione um abaixo.</p>';
}

async function del(id) {
  if (!confirm('Remover este produto e o histórico dele?')) return;
  await call(`${API}/${id}`, {method:'DELETE'});
  load();
}

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = 'Lendo o preço...';
  await call(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
    name: document.getElementById('name').value,
    url: document.getElementById('url').value,
    targetPrice: document.getElementById('target').value
  })});
  e.target.reset();
  load();
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
